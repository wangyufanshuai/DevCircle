server:
  port: 8201
  shutdown: graceful
spring:
  application:
    name: dc-identity
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    web-application-type: servlet
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
devcircle:
  production: ${DEVCIRCLE_PRODUCTION_MODE:false}
  identity:
    auth-datasource:
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${AUTH_MYSQL_DATABASE:dc_auth}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      username: ${MYSQL_USER:devcircle}
      password: ${MYSQL_PASSWORD:devcircle}
      maximum-pool-size: ${IDENTITY_AUTH_DB_POOL_MAX_SIZE:6}
      minimum-idle: ${IDENTITY_AUTH_DB_POOL_MIN_IDLE:1}
      connection-timeout: ${IDENTITY_AUTH_DB_POOL_CONNECTION_TIMEOUT_MS:3000}
  public-origin: ${PUBLIC_ORIGIN:http://localhost:5501}
  jwt:
    secret: ${DEVCIRCLE_JWT_SECRET:local-development-secret-must-be-at-least-forty-eight-characters-long}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    frontend-callback-uri: ${AUTH_FRONTEND_CALLBACK_URI:http://localhost:5501/auth/callback}
    github:
      enabled: ${GITHUB_OAUTH_ENABLED:false}
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      callback-uri: ${GITHUB_CALLBACK_URI:http://localhost:8080/api/auth/oauth2/github/callback}
  outbox:
    # Authentication events and operations keep their established logical producer identity.
    service-name: dc-auth
  user:
    auth-schema: ${AUTH_MYSQL_DATABASE:dc_auth}
    profile-backfill:
      enabled: ${USER_PROFILE_BACKFILL_ENABLED:true}
  user-runtime:
    consumer-enabled: ${USER_RUNTIME_CONSUMER_ENABLED:true}
    flyway-enabled: ${USER_FLYWAY_ENABLED:true}
    flyway-locations: classpath:db/user-migration
    outbox:
      enabled: ${USER_RUNTIME_OUTBOX_ENABLED:${devcircle.outbox.enabled:true}}
      # User events retain their domain producer identity after deployment aggregation.
      service-name: dc-user
    datasource:
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${USER_MYSQL_DATABASE:dc_user}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      username: ${MYSQL_USER:devcircle}
      password: ${MYSQL_PASSWORD:devcircle}
      maximum-pool-size: ${IDENTITY_USER_DB_POOL_MAX_SIZE:6}
      minimum-idle: ${IDENTITY_USER_DB_POOL_MIN_IDLE:1}
      connection-timeout: ${IDENTITY_USER_DB_POOL_CONNECTION_TIMEOUT_MS:3000}
  interaction-runtime:
    flyway-enabled: ${INTERACTION_FLYWAY_ENABLED:true}
    flyway-locations: classpath:db/interaction-migration
    outbox:
      enabled: ${INTERACTION_RUNTIME_OUTBOX_ENABLED:${devcircle.outbox.enabled:true}}
      service-name: dc-interaction
    datasource:
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${INTERACTION_MYSQL_DATABASE:dc_interaction}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      username: ${MYSQL_USER:devcircle}
      password: ${MYSQL_PASSWORD:devcircle}
      maximum-pool-size: ${IDENTITY_INTERACTION_DB_POOL_MAX_SIZE:5}
      minimum-idle: ${IDENTITY_INTERACTION_DB_POOL_MIN_IDLE:1}
      connection-timeout: ${IDENTITY_INTERACTION_DB_POOL_CONNECTION_TIMEOUT_MS:3000}
  internal:
    content-uri: ${DC_CONTENT_URI:http://localhost:8103}
    notification-uri: ${DC_NOTIFICATION_URI:http://localhost:8108}
