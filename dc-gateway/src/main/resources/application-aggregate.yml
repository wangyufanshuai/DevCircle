spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-auth
              uri: ${DC_AUTH_URI:http://localhost:8201}
              predicates:
                - Path=/api/auth/**
            - id: identity-dashboard
              uri: ${DC_IDENTITY_URI:http://localhost:8201}
              predicates:
                - Path=/api/me/**
            - id: identity-user-compatibility
              uri: ${DC_USER_URI:http://localhost:8102}
              predicates:
                - Path=/api/users/**
            - id: identity-interaction-compatibility
              uri: ${DC_INTERACTION_URI:http://localhost:8105}
              predicates:
                - Path=/api/posts/*/like,/api/posts/*/favorite,/api/posts/*/interaction-state
            - id: identity-notification-compatibility
              uri: ${DC_NOTIFICATION_URI:http://localhost:8108}
              predicates:
                - Path=/api/notifications/**,/ws/notifications/**
            - id: content-comments
              uri: ${DC_COMMENT_URI:http://localhost:8104}
              predicates:
                - Path=/api/comments/**,/api/posts/*/comments/**
            - id: content-moderation
              uri: ${DC_ADMIN_URI:http://localhost:8110}
              predicates:
                - Path=/api/admin/**
            - id: content-aggregate
              uri: ${DC_CONTENT_AGGREGATE_URI:http://localhost:8202}
              predicates:
                - Path=/api/posts/**,/api/deduction/**,/api/content/**,/api/files/**
            - id: discovery-search
              uri: ${DC_SEARCH_URI:http://localhost:8203}
              predicates:
                - Path=/api/search/**
            - id: discovery-recommend
              uri: ${DC_RECOMMEND_URI:http://localhost:8107}
              predicates:
                - Path=/api/recommend/**
