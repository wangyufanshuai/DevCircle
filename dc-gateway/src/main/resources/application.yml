server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: dc-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cloud:
    nacos:
      discovery:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: ${DC_AUTH_URI:http://localhost:8101}
              predicates:
                - Path=/api/auth/**
            - id: user
              uri: ${DC_USER_URI:http://localhost:8102}
              predicates:
                - Path=/api/users/**
            - id: identity-dashboard
              uri: ${DC_IDENTITY_URI:http://localhost:8201}
              predicates:
                - Path=/api/me/**
            - id: interaction
              uri: ${DC_INTERACTION_URI:${DC_IDENTITY_URI:http://localhost:8201}}
              predicates:
                - Path=/api/posts/*/like,/api/posts/*/favorite,/api/posts/*/interaction-state
            - id: post-comments
              uri: ${DC_COMMENT_URI:http://localhost:8104}
              predicates:
                - Path=/api/posts/*/comments/**
            - id: content
              uri: ${DC_CONTENT_URI:http://localhost:8103}
              predicates:
                - Path=/api/posts/**
            - id: deduction
              uri: ${DC_CONTENT_URI:http://localhost:8103}
              predicates:
                - Path=/api/deduction/**
            - id: content-admin
              uri: ${DC_CONTENT_URI:http://localhost:8103}
              predicates:
                - Path=/api/content/**
            - id: comment
              uri: ${DC_COMMENT_URI:http://localhost:8104}
              predicates:
                - Path=/api/comments/**
            - id: search
              uri: ${DC_SEARCH_URI:http://localhost:8106}
              predicates:
                - Path=/api/search/**
            - id: recommend
              uri: ${DC_RECOMMEND_URI:http://localhost:8107}
              predicates:
                - Path=/api/recommend/**
            - id: notification
              uri: ${DC_NOTIFICATION_URI:http://localhost:8108}
              predicates:
                - Path=/api/notifications/**,/ws/notifications/**
            - id: file
              uri: ${DC_FILE_URI:http://localhost:8109}
              predicates:
                - Path=/api/files/**
            - id: admin
              uri: ${DC_ADMIN_URI:http://localhost:8110}
              predicates:
                - Path=/api/admin/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p traceId=%X{traceId:-} userId=%X{userId:-}"
devcircle:
  production: ${DEVCIRCLE_PRODUCTION_MODE:false}
  jwt:
    secret: ${DEVCIRCLE_JWT_SECRET:local-development-secret-must-be-at-least-forty-eight-characters-long}
  gateway:
    banned-user-ids: ${GATEWAY_BANNED_USER_IDS:}
    no-post-user-ids: ${GATEWAY_NO_POST_USER_IDS:}
