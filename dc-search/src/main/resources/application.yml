server:
  port: 8106
  shutdown: graceful
spring:
  application:
    name: dc-search
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${SEARCH_MYSQL_DATABASE:dc_search}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:devcircle}
    password: ${MYSQL_PASSWORD:devcircle}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p traceId=%X{traceId:-} userId=%X{userId:-}"
devcircle:
  search:
    read-fallback-enabled: ${DEVCIRCLE_READ_FALLBACK_ENABLED:false}
