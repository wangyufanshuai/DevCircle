server:
  port: 8101
  shutdown: graceful
spring:
  application:
    name: dc-auth
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/dc_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:devcircle}
    password: ${MYSQL_PASSWORD:devcircle}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    enabled: true
devcircle:
  production: ${DEVCIRCLE_PRODUCTION_MODE:false}
  jwt:
    secret: ${DEVCIRCLE_JWT_SECRET:local-development-secret-must-be-at-least-forty-eight-characters-long}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    frontend-callback-uri: ${AUTH_FRONTEND_CALLBACK_URI:http://localhost:5501/auth/callback}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      callback-uri: ${GITHUB_CALLBACK_URI:http://localhost:8080/api/auth/oauth2/github/callback}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p traceId=%X{traceId:-} userId=%X{userId:-}"
