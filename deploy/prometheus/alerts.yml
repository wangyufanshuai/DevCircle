groups:
  - name: devcircle-core
    rules:
      - alert: DevCircleServiceDown
        expr: up{job="devcircle"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DevCircle service is down"
          description: "{{ $labels.instance }} has not responded to Prometheus for 2 minutes."

      - alert: DevCircleHighHttp5xx
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (instance)
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])) by (instance), 0.001)
          > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate"
          description: "{{ $labels.instance }} has returned more than 1% 5xx responses for 5 minutes."

      - alert: DevCircleHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, instance)) > 0.6
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency"
          description: "{{ $labels.instance }} aggregate p95 latency is above the 600ms write SLO."

      - alert: DevCircleJvmMemoryPressure
        expr: sum(jvm_memory_used_bytes{area="heap"}) by (instance) / sum(jvm_memory_max_bytes{area="heap"}) by (instance) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap pressure"
          description: "{{ $labels.instance }} heap usage is above 85%."

      - alert: DevCircleMySqlPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MySQL connection pool nearly exhausted"
          description: "{{ $labels.instance }} active Hikari connections exceed 90%."
