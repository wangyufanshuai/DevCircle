groups:
  - name: devcircle-runtime
    rules:
      - alert: DevCircleServiceDown
        expr: up{job="devcircle"} == 0
        for: 2m
        labels: { severity: critical, team: platform }
        annotations:
          summary: "DevCircle service is down"
          description: "{{ $labels.service }} at {{ $labels.instance }} has not responded for 2 minutes."
          runbook_url: "https://github.com/wangyufanshuai/DevCircle/blob/main/docs/observability-runbook.md#service-down"

      - alert: DevCircleJvmMemoryPressure
        expr: sum(jvm_memory_used_bytes{area="heap"}) by (service, instance) / sum(jvm_memory_max_bytes{area="heap"}) by (service, instance) > 0.85
        for: 10m
        labels: { severity: warning, team: platform }
        annotations:
          summary: "JVM heap pressure"
          description: "{{ $labels.service }} heap usage is above 85% for 10 minutes."
          runbook_url: "https://github.com/wangyufanshuai/DevCircle/blob/main/docs/observability-runbook.md#jvm-memory-pressure"

      - alert: DevCircleMySqlPoolExhausted
        expr: hikaricp_connections_active / clamp_min(hikaricp_connections_max, 1) > 0.9
        for: 5m
        labels: { severity: critical, team: platform }
        annotations:
          summary: "MySQL connection pool nearly exhausted"
          description: "{{ $labels.service }} active Hikari connections exceed 90%."
          runbook_url: "https://github.com/wangyufanshuai/DevCircle/blob/main/docs/observability-runbook.md#mysql-pool-exhausted"

      - alert: DevCircleGatewayRateLimitDependencyUnavailable
        expr: increase(devcircle_gateway_rate_limit_total{outcome="dependency_unavailable"}[5m]) > 0
        for: 2m
        labels: { severity: critical, team: platform }
        annotations:
          summary: "Gateway shared rate-limit store is unavailable"
          description: "Gateway requests are failing closed because Redis rate-limit counters are unavailable."
          runbook_url: "https://github.com/wangyufanshuai/DevCircle/blob/main/docs/observability-runbook.md#rate-limit-dependency-unavailable"

  - name: devcircle-events
    rules:
      - alert: DevCircleOutboxFleetIncomplete
        expr: devcircle_outbox_fleet_complete{service="dc-admin"} == 0
        for: 2m
        labels: { severity: critical, team: platform }
        annotations:
          summary: "Outbox fleet snapshot is incomplete"
          description: "At least one transactional outbox source is unavailable; known counts are not fleet totals."
          runbook_url: "https://github.com/wangyufanshuai/DevCircle/blob/main/docs/observability-runbook.md#outbox-fleet-incomplete"

      - alert: DevCircleOutboxDead
        expr: devcircle_outbox_fleet_dead{service="dc-admin"} > 0
        for: 2m
        labels: { severity: critical, team: platform }
        annotations:
          summary: "Dead outbox events require operator action"
          description: "{{ $value }} known outbox events exhausted automatic retries."
          runbook_url: "https://github.com/wangyufanshuai/DevCircle/blob/main/docs/observability-runbook.md#outbox-dead-or-blocked"

      - alert: DevCircleOutboxBlocked
        expr: devcircle_outbox_fleet_blocked{service="dc-admin"} > 0
        for: 2m
        labels: { severity: critical, team: platform }
        annotations:
          summary: "Outbox streams are blocked behind dead events"
          description: "{{ $value }} events cannot publish until their dead predecessor is handled."
          runbook_url: "https://github.com/wangyufanshuai/DevCircle/blob/main/docs/observability-runbook.md#outbox-dead-or-blocked"

      - alert: DevCircleOutboxBacklogHigh
        expr: devcircle_outbox_fleet_backlog{service="dc-admin"} > 100
        for: 10m
        labels: { severity: warning, team: platform }
        annotations:
          summary: "Outbox backlog remains high"
          description: "Known fleet backlog has remained above 100 for 10 minutes."
          runbook_url: "https://github.com/wangyufanshuai/DevCircle/blob/main/docs/observability-runbook.md#outbox-backlog-high"

      - alert: DevCircleOutboxMetricsMissing
        expr: absent(devcircle_outbox_fleet_complete{service="dc-admin"})
        for: 5m
        labels: { severity: warning, team: platform }
        annotations:
          summary: "Outbox fleet metrics are missing"
          description: "Prometheus has not observed the Admin outbox fleet gauges for 5 minutes."
          runbook_url: "https://github.com/wangyufanshuai/DevCircle/blob/main/docs/observability-runbook.md#outbox-fleet-incomplete"
