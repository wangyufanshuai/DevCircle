global:
  resolve_timeout: 5m

route:
  receiver: operations-webhook
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: operations-webhook
      repeat_interval: 30m
    - matchers: [severity="warning"]
      receiver: operations-webhook
      repeat_interval: 4h

receivers:
  - name: operations-webhook
    webhook_configs:
      - url: https://alerts.example.invalid/devcircle
        send_resolved: true
