image:
  registry: ghcr.io/wangyufanshuai/devcircle
  tag: dev
  pullPolicy: IfNotPresent
  requireSha: false

replicaCount: 1

services:
  gateway:
    port: 8080
    env:
      SPRING_PROFILES_ACTIVE: aggregate
      DC_AUTH_URI: http://dc-identity:8201
      DC_IDENTITY_URI: http://dc-identity:8201
      DC_CONTENT_AGGREGATE_URI: http://dc-content-aggregate:8202
      DC_DISCOVERY_URI: http://dc-discovery:8203
      DC_SEARCH_URI: http://dc-discovery:8203
      DC_RECOMMEND_URI: http://dc-recommend:8107
  identity:
    port: 8201
  content-aggregate: { port: 8202 }
  discovery: { port: 8203 }
  user: { port: 8102 }
  comment: { port: 8104 }
  interaction: { port: 8105 }
  recommend: { port: 8107 }
  notification: { port: 8108 }
  admin:
    port: 8110
    env: { DC_AUTH_URI: http://dc-identity:8201 }

env:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: devcircle
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ELASTICSEARCH_URIS: http://elasticsearch:9200
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: devcircle
  DEVCIRCLE_CONTENT_BASE_URL: http://dc-content-aggregate:8202
  DC_USER_URI: http://dc-user:8102
  DC_CONTENT_URI: http://dc-content-aggregate:8202
  DC_COMMENT_URI: http://dc-comment:8104
  DC_INTERACTION_URI: http://dc-interaction:8105
  DC_NOTIFICATION_URI: http://dc-notification:8108
  DC_ADMIN_URI: http://dc-admin:8110

secretEnv: {}
secretEnvRefs:
  MYSQL_PASSWORD: MYSQL_PASSWORD
  REDIS_PASSWORD: REDIS_PASSWORD
  S3_ACCESS_KEY: S3_ACCESS_KEY
  S3_SECRET_KEY: S3_SECRET_KEY
  DEVCIRCLE_JWT_SECRET: DEVCIRCLE_JWT_SECRET
  DEVCIRCLE_INTERNAL_OPS_KEY: DEVCIRCLE_INTERNAL_OPS_KEY

secrets:
  create: false
  existingSecret: devcircle-secrets

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi

ingress:
  enabled: true
  host: devcircle.local

objectStorage:
  serviceName: minio
  servicePort: 9000
  path: /devcircle
