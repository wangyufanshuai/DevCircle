image:
  registry: ghcr.io/wangyufanshuai/devcircle
  tag: dev
  pullPolicy: IfNotPresent
  requireSha: false

# Default false until real MySQL/Kafka/Gateway WebSocket and user-isolation
# evidence is attached to an approved production change.
notificationIdentityCutover:
  enabled: false

replicaCount: 1

# Explicit aggregate ceiling for Identity's Auth/User/Interaction/Notification Hikari pools.
# The production override accounts for all replicas on the target MySQL host.
identityDatabaseConnectionBudget: 12

services:
  gateway:
    port: 8080
    env:
      SPRING_PROFILES_ACTIVE: aggregate
      DC_AUTH_URI: http://dc-identity:8201
      DC_IDENTITY_URI: http://dc-identity:8201
      DC_USER_URI: http://dc-identity:8201
      DC_INTERACTION_URI: http://dc-identity:8201
      DC_CONTENT_AGGREGATE_URI: http://dc-content-aggregate:8202
      DC_DISCOVERY_URI: http://dc-discovery:8203
      DC_SEARCH_URI: http://dc-discovery:8203
      DC_RECOMMEND_URI: http://dc-recommend:8107
      DC_NOTIFICATION_URI: http://dc-notification:8108
  identity:
    port: 8201
    env:
      IDENTITY_AUTH_DB_POOL_MAX_SIZE: "4"
      IDENTITY_AUTH_DB_POOL_MIN_IDLE: "1"
      IDENTITY_USER_DB_POOL_MAX_SIZE: "3"
      IDENTITY_USER_DB_POOL_MIN_IDLE: "1"
      IDENTITY_INTERACTION_DB_POOL_MAX_SIZE: "3"
      IDENTITY_INTERACTION_DB_POOL_MIN_IDLE: "1"
      IDENTITY_NOTIFICATION_DB_POOL_MAX_SIZE: "2"
      IDENTITY_NOTIFICATION_DB_POOL_MIN_IDLE: "1"
      INTERACTION_FLYWAY_ENABLED: "true"
      INTERACTION_RUNTIME_OUTBOX_ENABLED: "true"
      NOTIFICATION_RUNTIME_API_ENABLED: "false"
      NOTIFICATION_FLYWAY_ENABLED: "false"
      NOTIFICATION_RUNTIME_CONSUMER_ENABLED: "false"
      NOTIFICATION_RUNTIME_TOPIC_ADMIN_ENABLED: "false"
      NOTIFICATION_RUNTIME_WEBSOCKET_ENABLED: "false"
      # One-version rollback compatibility; current Dashboard does not consume it.
      DC_NOTIFICATION_URI: http://dc-notification:8108
  content-aggregate:
    port: 8202
    env:
      DC_USER_URI: http://dc-identity:8201
      DC_INTERACTION_URI: http://dc-identity:8201
      COMMENT_RUNTIME_ENABLED: "false"
  discovery: { port: 8203 }
  comment: { port: 8104 }
  recommend: { port: 8107 }
  notification:
    port: 8108
    env:
      PUBLIC_ORIGIN: http://devcircle.local
  admin:
    port: 8110
    env:
      DC_AUTH_URI: http://dc-identity:8201
      DC_USER_URI: http://dc-identity:8201
      DC_AUTH_OUTBOX_PATH: /internal/ops/identity/outbox/auth/status
      DC_USER_OUTBOX_PATH: /internal/ops/identity/outbox/user/status
      DC_INTERACTION_URI: http://dc-identity:8201
      DC_INTERACTION_OUTBOX_PATH: /internal/ops/identity/outbox/interaction/status

env:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: devcircle
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ELASTICSEARCH_URIS: http://elasticsearch:9200
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: devcircle
  DEVCIRCLE_CONTENT_BASE_URL: http://dc-content-aggregate:8202
  DC_CONTENT_URI: http://dc-content-aggregate:8202
  DC_COMMENT_URI: http://dc-comment:8104
  DC_ADMIN_URI: http://dc-admin:8110

secretEnv: {}
secretEnvRefs:
  MYSQL_PASSWORD: MYSQL_PASSWORD
  REDIS_PASSWORD: REDIS_PASSWORD
  S3_ACCESS_KEY: S3_ACCESS_KEY
  S3_SECRET_KEY: S3_SECRET_KEY
  DEVCIRCLE_JWT_SECRET: DEVCIRCLE_JWT_SECRET
  DEVCIRCLE_INTERNAL_OPS_KEY: DEVCIRCLE_INTERNAL_OPS_KEY

secrets:
  create: false
  existingSecret: devcircle-secrets

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi

ingress:
  enabled: true
  host: devcircle.local

objectStorage:
  serviceName: minio
  servicePort: 9000
  path: /devcircle
