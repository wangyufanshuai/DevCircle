image:
  registry: ghcr.io/wangyufanshuai/devcircle
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

services:
  gateway: { port: 8080 }
  auth: { port: 8101 }
  user: { port: 8102 }
  content: { port: 8103 }
  comment: { port: 8104 }
  interaction: { port: 8105 }
  search: { port: 8106 }
  recommend: { port: 8107 }
  notification: { port: 8108 }
  file: { port: 8109 }
  admin: { port: 8110 }

env:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: devcircle
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ELASTICSEARCH_URIS: http://elasticsearch:9200
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: devcircle
  GATEWAY_DEMO_TOKEN_ENABLED: "false"

secretEnv:
  MYSQL_PASSWORD: change-me
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  DEVCIRCLE_JWT_SECRET: change-me-change-me-change-me-change-me

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi

ingress:
  enabled: true
  host: devcircle.local
