image:
  registry: ghcr.io/wangyufanshuai/devcircle
  tag: dev
  pullPolicy: IfNotPresent
  requireSha: false

replicaCount: 1

services:
  gateway: { port: 8080 }
  identity: { port: 8201 }
  content-aggregate: { port: 8202 }
  discovery: { port: 8203 }
  auth: { port: 8101 }
  user: { port: 8102 }
  content: { port: 8103 }
  comment: { port: 8104 }
  interaction: { port: 8105 }
  search: { port: 8106 }
  recommend: { port: 8107 }
  notification: { port: 8108 }
  file: { port: 8109 }
  admin: { port: 8110 }

env:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: devcircle
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ELASTICSEARCH_URIS: http://elasticsearch:9200
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: devcircle
  DEVCIRCLE_CONTENT_BASE_URL: http://dc-content:8103
  DC_AUTH_URI: http://dc-auth:8101
  DC_USER_URI: http://dc-user:8102
  DC_CONTENT_URI: http://dc-content:8103
  DC_COMMENT_URI: http://dc-comment:8104
  DC_INTERACTION_URI: http://dc-interaction:8105
  DC_SEARCH_URI: http://dc-search:8106
  DC_RECOMMEND_URI: http://dc-recommend:8107
  DC_NOTIFICATION_URI: http://dc-notification:8108
  DC_FILE_URI: http://dc-file:8109
  DC_ADMIN_URI: http://dc-admin:8110

secretEnv: {}
secretEnvKeys:
  - MYSQL_PASSWORD
  - REDIS_PASSWORD
  - S3_ACCESS_KEY
  - S3_SECRET_KEY
  - DEVCIRCLE_JWT_SECRET

secrets:
  create: false
  existingSecret: devcircle-secrets

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi

ingress:
  enabled: true
  host: devcircle.local
