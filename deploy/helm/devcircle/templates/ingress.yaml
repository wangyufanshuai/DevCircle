{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devcircle
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.objectStorage.path }}/
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.objectStorage.serviceName }}
                port:
                  number: {{ .Values.objectStorage.servicePort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dc-gateway
                port:
                  number: 8080
{{- end }}
