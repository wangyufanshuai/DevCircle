{{- if .Values.secrets.create }}
{{- $secretValues := (.Values.secretEnv | default dict) }}
{{- range $envName, $secretKey := (.Values.secretEnvRefs | default dict) }}
{{- if not (hasKey $secretValues $secretKey) }}
{{- fail (printf "created Secret is missing required key %s" $secretKey) }}
{{- end }}
{{- end }}
{{- range $serviceName, $service := .Values.services }}
{{- range $envName, $secretKey := ($service.secretEnvRefs | default dict) }}
{{- if not (hasKey $secretValues $secretKey) }}
{{- fail (printf "created Secret is missing key %s required by service %s" $secretKey $serviceName) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: "{{ $value }}"
  {{- end }}
{{- end }}
