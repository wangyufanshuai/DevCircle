{{- if and .Values.image.requireSha (not (regexMatch "^[0-9a-f]{40}$" .Values.image.tag)) }}
{{- fail "production image.tag must be a full 40-character git SHA" }}
{{- end }}
{{- if .Values.image.requireSha }}
{{- $publicOrigin := trimSuffix "/" (required "production publicOrigin is required" .Values.publicOrigin) }}
{{- if or (not (regexMatch "^https://[^/]+$" $publicOrigin)) (regexMatch "(?i)(localhost|127\\.0\\.0\\.1|\\[::1\\])" $publicOrigin) }}
{{- fail "production publicOrigin must be a public HTTPS origin" }}
{{- end }}
{{- $globalEnv := (.Values.env | default dict) }}
{{- if ne (toString (index $globalEnv "S3_PRESIGN_ENDPOINT")) $publicOrigin }}
{{- fail "production S3_PRESIGN_ENDPOINT must match publicOrigin" }}
{{- end }}
{{- if ne (toString (index $globalEnv "S3_PUBLIC_BASE_URL")) (printf "%s/devcircle" $publicOrigin) }}
{{- fail "production S3_PUBLIC_BASE_URL must derive from publicOrigin" }}
{{- end }}
{{- $identity := required "production identity service is required" (index .Values.services "identity") }}
{{- $identityEnv := ($identity.env | default dict) }}
{{- if ne (toString (index $identityEnv "AUTH_COOKIE_SECURE")) "true" }}
{{- fail "production identity must set AUTH_COOKIE_SECURE=true" }}
{{- end }}
{{- if ne (toString (index $identityEnv "PUBLIC_ORIGIN")) $publicOrigin }}
{{- fail "production identity PUBLIC_ORIGIN must match publicOrigin" }}
{{- end }}
{{- if ne (toString (index $identityEnv "AUTH_FRONTEND_CALLBACK_URI")) (printf "%s/auth/callback" $publicOrigin) }}
{{- fail "production identity AUTH_FRONTEND_CALLBACK_URI must derive from publicOrigin" }}
{{- end }}
{{- if ne (toString (index $identityEnv "GITHUB_CALLBACK_URI")) (printf "%s/api/auth/oauth2/github/callback" $publicOrigin) }}
{{- fail "production identity GITHUB_CALLBACK_URI must derive from publicOrigin" }}
{{- end }}
{{- if ne (toString (index $identityEnv "GITHUB_OAUTH_ENABLED")) "true" }}
{{- fail "production identity must explicitly enable GitHub OAuth" }}
{{- end }}
{{- if ne (toString (index $identityEnv "INTERACTION_FLYWAY_ENABLED")) "true" }}
{{- fail "production identity must enable Interaction Flyway" }}
{{- end }}
{{- if ne (toString (index $identityEnv "INTERACTION_RUNTIME_OUTBOX_ENABLED")) "true" }}
{{- fail "production identity must enable Interaction Outbox" }}
{{- end }}
{{- if ne (toString (index $identityEnv "NOTIFICATION_RUNTIME_API_ENABLED")) "false" }}
{{- fail "production identity must disable Notification API before cutover" }}
{{- end }}
{{- if ne (toString (index $identityEnv "NOTIFICATION_FLYWAY_ENABLED")) "false" }}
{{- fail "production identity must disable Notification Flyway before cutover" }}
{{- end }}
{{- if ne (toString (index $identityEnv "NOTIFICATION_RUNTIME_CONSUMER_ENABLED")) "false" }}
{{- fail "production identity must disable Notification consumer before cutover" }}
{{- end }}
{{- if ne (toString (index $identityEnv "NOTIFICATION_RUNTIME_TOPIC_ADMIN_ENABLED")) "false" }}
{{- fail "production identity must disable Notification topic admin before cutover" }}
{{- end }}
{{- if ne (toString (index $identityEnv "NOTIFICATION_RUNTIME_WEBSOCKET_ENABLED")) "false" }}
{{- fail "production identity must keep secure Notification WebSocket infrastructure default-off before its dedicated cutover" }}
{{- end }}
{{- if ne (toString (index $identityEnv "DC_NOTIFICATION_URI")) "http://dc-notification:8108" }}
{{- fail "production identity must retain DC_NOTIFICATION_URI for one-version rollback compatibility" }}
{{- end }}
{{- $authPool := int (required "production identity Auth pool budget is required" (index $identityEnv "IDENTITY_AUTH_DB_POOL_MAX_SIZE")) }}
{{- $userPool := int (required "production identity User pool budget is required" (index $identityEnv "IDENTITY_USER_DB_POOL_MAX_SIZE")) }}
{{- $interactionPool := int (required "production identity Interaction pool budget is required" (index $identityEnv "IDENTITY_INTERACTION_DB_POOL_MAX_SIZE")) }}
{{- $notificationPool := int (required "production identity Notification pool budget is required" (index $identityEnv "IDENTITY_NOTIFICATION_DB_POOL_MAX_SIZE")) }}
{{- if or (lt $authPool 1) (lt $userPool 1) (lt $interactionPool 1) (lt $notificationPool 1) }}
{{- fail "production identity Auth, User, Interaction and Notification pool budgets must all be positive" }}
{{- end }}
{{- $identityConnectionBudget := int (required "production identity database connection budget is required" .Values.identityDatabaseConnectionBudget) }}
{{- if lt $identityConnectionBudget 1 }}
{{- fail "production identity database connection budget must be positive" }}
{{- end }}
{{- if gt $identityConnectionBudget (mul 16 (.Values.replicaCount | int)) }}
{{- fail "production identity database connection budget must not exceed 16 connections per replica" }}
{{- end }}
{{- if gt (mul (add (add (add $authPool $userPool) $interactionPool) $notificationPool) (.Values.replicaCount | int)) $identityConnectionBudget }}
{{- fail "production identity aggregate DB pools must fit identityDatabaseConnectionBudget" }}
{{- end }}
{{- $notification := required "production notification service is required before Identity cutover" (index .Values.services "notification") }}
{{- $notificationEnv := ($notification.env | default dict) }}
{{- if ne (toString (index $notificationEnv "PUBLIC_ORIGIN")) $publicOrigin }}
{{- fail "production notification PUBLIC_ORIGIN must match publicOrigin" }}
{{- end }}
{{- $globalSecretRefs := (.Values.secretEnvRefs | default dict) }}
{{- if ne (toString (index $globalSecretRefs "DEVCIRCLE_INTERNAL_OPS_KEY")) "DEVCIRCLE_INTERNAL_OPS_KEY" }}
{{- fail "production services must project DEVCIRCLE_INTERNAL_OPS_KEY from a Secret" }}
{{- end }}
{{- $identitySecretRefs := ($identity.secretEnvRefs | default dict) }}
{{- if or (ne (toString (index $identitySecretRefs "GITHUB_CLIENT_ID")) "GITHUB_CLIENT_ID") (ne (toString (index $identitySecretRefs "GITHUB_CLIENT_SECRET")) "GITHUB_CLIENT_SECRET") }}
{{- fail "production identity must project GitHub OAuth credentials from a Secret" }}
{{- end }}
{{- end }}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-{{ $name }}
  labels:
    app.kubernetes.io/name: dc-{{ $name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dc-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dc-{{ $name }}
    spec:
      containers:
        - name: dc-{{ $name }}
          image: "{{ $.Values.image.registry }}/dc-{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- range $key, $value := $.Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
            {{- range $key, $value := ($svc.env | default dict) }}
            {{- if hasKey $.Values.env $key }}
            {{- fail (printf "service %s duplicates global environment key %s" $name $key) }}
            {{- end }}
            {{- if hasKey $.Values.secretEnvRefs $key }}
            {{- fail (printf "service %s environment key %s duplicates a global Secret projection" $name $key) }}
            {{- end }}
            {{- if hasKey ($svc.secretEnvRefs | default dict) $key }}
            {{- fail (printf "service %s environment key %s duplicates a service Secret projection" $name $key) }}
            {{- end }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
            {{- range $envName, $secretKey := $.Values.secretEnvRefs }}
            {{- if hasKey $.Values.env $envName }}
            {{- fail (printf "global environment key %s duplicates a global Secret projection" $envName) }}
            {{- end }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: {{ $secretKey }}
                  optional: false
            {{- end }}
            {{- range $envName, $secretKey := ($svc.secretEnvRefs | default dict) }}
            {{- if hasKey $.Values.secretEnvRefs $envName }}
            {{- fail (printf "service %s Secret projection %s duplicates a global Secret projection" $name $envName) }}
            {{- end }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: {{ $secretKey }}
                  optional: false
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: dc-{{ $name }}
spec:
  selector:
    app.kubernetes.io/name: dc-{{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
