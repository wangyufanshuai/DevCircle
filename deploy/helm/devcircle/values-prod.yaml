image:
  registry: ghcr.io/wangyufanshuai/devcircle
  # Required at deploy time: --set image.tag=$GITHUB_SHA
  tag: sha-required
  pullPolicy: IfNotPresent
  requireSha: true

replicaCount: 2

# 2 replicas * (6 Auth + 4 User + 3 Interaction + 3 Notification) = 32 connections.
# This is the complete Identity share of the single-host MySQL 120-connection ceiling.
identityDatabaseConnectionBudget: 32

# 2 replicas * (5 Content + 3 optional Comment) = 16 connections maximum.
contentAggregateDatabaseConnectionBudget: 16

publicOrigin: https://mysticverse.example.com

services:
  content-aggregate:
    env:
      CONTENT_DB_POOL_MAX_SIZE: "5"
      CONTENT_DB_POOL_MIN_IDLE: "1"
      COMMENT_DB_POOL_MAX_SIZE: "3"
      COMMENT_DB_POOL_MIN_IDLE: "0"
      CONTENT_AGGREGATE_DB_POOL_CEILING: "8"
      COMMENT_RUNTIME_ENABLED: "false"
  identity:
    env:
      AUTH_COOKIE_SECURE: "true"
      AUTH_FRONTEND_CALLBACK_URI: https://mysticverse.example.com/auth/callback
      GITHUB_CALLBACK_URI: https://mysticverse.example.com/api/auth/oauth2/github/callback
      GITHUB_OAUTH_ENABLED: "true"
      PUBLIC_ORIGIN: https://mysticverse.example.com
      # Per replica: 6 Auth + 4 User + 3 Interaction + 3 Notification = 16.
      IDENTITY_AUTH_DB_POOL_MAX_SIZE: "6"
      IDENTITY_AUTH_DB_POOL_MIN_IDLE: "1"
      IDENTITY_USER_DB_POOL_MAX_SIZE: "4"
      IDENTITY_USER_DB_POOL_MIN_IDLE: "1"
      IDENTITY_INTERACTION_DB_POOL_MAX_SIZE: "3"
      IDENTITY_INTERACTION_DB_POOL_MIN_IDLE: "1"
      IDENTITY_NOTIFICATION_DB_POOL_MAX_SIZE: "3"
      IDENTITY_NOTIFICATION_DB_POOL_MIN_IDLE: "1"
      # Identity is the sole Interaction owner in the default production topology.
      INTERACTION_FLYWAY_ENABLED: "true"
      INTERACTION_RUNTIME_OUTBOX_ENABLED: "true"
      NOTIFICATION_RUNTIME_API_ENABLED: "false"
      NOTIFICATION_FLYWAY_ENABLED: "false"
      NOTIFICATION_RUNTIME_CONSUMER_ENABLED: "false"
      NOTIFICATION_RUNTIME_TOPIC_ADMIN_ENABLED: "false"
      NOTIFICATION_RUNTIME_WEBSOCKET_ENABLED: "false"
    secretEnvRefs:
      GITHUB_CLIENT_ID: GITHUB_CLIENT_ID
      GITHUB_CLIENT_SECRET: GITHUB_CLIENT_SECRET
  notification:
    env:
      PUBLIC_ORIGIN: https://mysticverse.example.com
env:
  DEVCIRCLE_PRODUCTION_MODE: "true"
  DEVCIRCLE_READ_FALLBACK_ENABLED: "false"
  DEVCIRCLE_THEME_CONTENT_SEED_ENABLED: "false"
  S3_PRESIGN_ENDPOINT: https://mysticverse.example.com
  S3_PUBLIC_BASE_URL: https://mysticverse.example.com/devcircle
  SPRINGDOC_API_DOCS_ENABLED: "false"
  SPRINGDOC_SWAGGER_UI_ENABLED: "false"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0 -XX:+ExitOnOutOfMemoryError"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
  SERVER_TOMCAT_THREADS_MAX: "48"
  SERVER_TOMCAT_ACCEPT_COUNT: "64"

secretEnv: {}

secrets:
  create: false
  existingSecret: devcircle-secrets

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 1500m
    memory: 1Gi

ingress:
  enabled: true
  host: mysticverse.example.com
