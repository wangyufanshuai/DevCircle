image:
  registry: ghcr.io/wangyufanshuai/devcircle
  # Required at deploy time: --set image.tag=$GITHUB_SHA
  tag: sha-required
  pullPolicy: IfNotPresent
  requireSha: true

replicaCount: 2

publicOrigin: https://mysticverse.example.com

services:
  identity:
    env:
      AUTH_COOKIE_SECURE: "true"
      AUTH_FRONTEND_CALLBACK_URI: https://mysticverse.example.com/auth/callback
      GITHUB_CALLBACK_URI: https://mysticverse.example.com/api/auth/oauth2/github/callback
      GITHUB_OAUTH_ENABLED: "true"
      PUBLIC_ORIGIN: https://mysticverse.example.com
    secretEnvRefs:
      GITHUB_CLIENT_ID: GITHUB_CLIENT_ID
      GITHUB_CLIENT_SECRET: GITHUB_CLIENT_SECRET

env:
  DEVCIRCLE_PRODUCTION_MODE: "true"
  DEVCIRCLE_READ_FALLBACK_ENABLED: "false"
  DEVCIRCLE_THEME_CONTENT_SEED_ENABLED: "false"
  S3_PRESIGN_ENDPOINT: https://mysticverse.example.com
  S3_PUBLIC_BASE_URL: https://mysticverse.example.com/devcircle
  SPRINGDOC_API_DOCS_ENABLED: "false"
  SPRINGDOC_SWAGGER_UI_ENABLED: "false"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0 -XX:+ExitOnOutOfMemoryError"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
  SERVER_TOMCAT_THREADS_MAX: "48"
  SERVER_TOMCAT_ACCEPT_COUNT: "64"

secretEnv: {}

secrets:
  create: false
  existingSecret: devcircle-secrets

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 1500m
    memory: 1Gi

ingress:
  enabled: true
  host: mysticverse.example.com
