# Explicit rollback overlay for a release that predates the embedded User runtime.
# The base production topology owns User APIs, projection consumption and the User
# Outbox inside dc-identity. This overlay restores the standalone executable JAR
# and disables every User background writer in Identity to prevent dual consumers.
services:
  dc-user:
    image: ghcr.io/wangyufanshuai/devcircle/dc-user:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-devcircle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DEVCIRCLE_PRODUCTION_MODE: "true"
      DEVCIRCLE_READ_FALLBACK_ENABLED: "false"
      DEVCIRCLE_THEME_CONTENT_SEED_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      DEVCIRCLE_INTERNAL_OPS_KEY: ${DEVCIRCLE_INTERNAL_OPS_KEY:?DEVCIRCLE_INTERNAL_OPS_KEY is required}
      DEVCIRCLE_OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      DEVCIRCLE_OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
      DEVCIRCLE_OUTBOX_SEND_TIMEOUT_MS: ${OUTBOX_SEND_TIMEOUT_MS:-15000}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLE_RATE:-0.1}
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES_HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0 -XX:+ExitOnOutOfMemoryError"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE:-8}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_POOL_MIN_IDLE:-1}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT_MS:-3000}
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-48}
      SERVER_TOMCAT_ACCEPT_COUNT: ${SERVER_TOMCAT_ACCEPT_COUNT:-64}
    expose: ["8102"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8102/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 12
    networks: [devcircle]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  dc-identity:
    environment:
      # Older Identity images compose the dashboard over the standalone User API.
      # Keep this route only in the rollback overlay; current Identity embeds User.
      DC_USER_URI: http://dc-user:8102
      USER_RUNTIME_CONSUMER_ENABLED: "false"
      USER_PROFILE_BACKFILL_ENABLED: "false"
      USER_RUNTIME_OUTBOX_ENABLED: "false"
      USER_FLYWAY_ENABLED: "false"
    depends_on:
      dc-user: { condition: service_healthy }

  dc-gateway:
    environment:
      DC_USER_URI: http://dc-user:8102
    depends_on:
      dc-user: { condition: service_healthy }

  dc-content-aggregate:
    environment:
      DC_USER_URI: http://dc-user:8102
    depends_on:
      dc-user: { condition: service_healthy }

  dc-admin:
    environment:
      DC_USER_URI: http://dc-user:8102
      DC_USER_OUTBOX_PATH: /internal/ops/outbox/status
    depends_on:
      dc-user: { condition: service_healthy }

  prometheus:
    volumes:
      # Compose resolves overlay bind paths relative to the first Compose file.
      - ./deploy/prometheus/prometheus.legacy-user-rollback.yml:/etc/prometheus/prometheus.yml:ro
