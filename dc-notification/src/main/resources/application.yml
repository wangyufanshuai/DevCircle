server:
  port: 8108
spring:
  application:
    name: dc-notification
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/dc_notification?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:devcircle}
    password: ${MYSQL_PASSWORD:devcircle}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

