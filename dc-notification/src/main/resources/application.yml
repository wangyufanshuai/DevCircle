server:
  port: 8108
  shutdown: graceful
spring:
  application:
    name: dc-notification
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${NOTIFICATION_MYSQL_DATABASE:dc_notification}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:devcircle}
    password: ${MYSQL_PASSWORD:devcircle}
  flyway:
    enabled: true
    locations: classpath:db/notification-migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
devcircle:
  notification-runtime:
    # The standalone deployment owns these capabilities until production traffic
    # is deliberately cut over to dc-identity.
    api-enabled: true
    consumer-enabled: true
    topic-admin-enabled: true
    websocket-enabled: true
    allowed-origin: ${PUBLIC_ORIGIN:http://localhost:5501}
  content:
    base-url: ${DEVCIRCLE_CONTENT_BASE_URL:http://localhost:8103}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p traceId=%X{traceId:-} userId=%X{userId:-}"
