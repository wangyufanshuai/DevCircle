name: devcircle-prod

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-env: &app-env
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: ${MYSQL_USER:-devcircle}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DEVCIRCLE_KAFKA_DLT_PUBLISH_TIMEOUT_MS: ${KAFKA_DLT_PUBLISH_TIMEOUT_MS:-5000}
  DEVCIRCLE_OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
  DEVCIRCLE_OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
  DEVCIRCLE_OUTBOX_SEND_TIMEOUT_MS: ${OUTBOX_SEND_TIMEOUT_MS:-15000}
  ELASTICSEARCH_URIS: http://elasticsearch:9200
  S3_ENDPOINT: http://minio:9000
  S3_PRESIGN_ENDPOINT: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  S3_PUBLIC_BASE_URL: ${PUBLIC_ORIGIN}/devcircle
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  S3_BUCKET: devcircle
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  DEVCIRCLE_JWT_SECRET: ${DEVCIRCLE_JWT_SECRET:?DEVCIRCLE_JWT_SECRET is required}
  DEVCIRCLE_INTERNAL_OPS_KEY: ${DEVCIRCLE_INTERNAL_OPS_KEY:?DEVCIRCLE_INTERNAL_OPS_KEY is required}
  DEVCIRCLE_PRODUCTION_MODE: "true"
  DEVCIRCLE_READ_FALLBACK_ENABLED: "false"
  DEVCIRCLE_THEME_CONTENT_SEED_ENABLED: "false"
  DEVCIRCLE_CONTENT_BASE_URL: http://dc-content-aggregate:8202
  AUTH_COOKIE_SECURE: "true"
  SPRINGDOC_API_DOCS_ENABLED: "false"
  SPRINGDOC_SWAGGER_UI_ENABLED: "false"
  AUTH_FRONTEND_CALLBACK_URI: ${PUBLIC_ORIGIN}/auth/callback
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_CALLBACK_URI: ${PUBLIC_ORIGIN}/api/auth/oauth2/github/callback
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLE_RATE:-0.1}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES_HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
  MANAGEMENT_METRICS_DISTRIBUTION_SLO_HTTP_SERVER_REQUESTS: 0.1s,0.3s,0.6s,1s,2s
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0 -XX:+ExitOnOutOfMemoryError"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE:-8}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_POOL_MIN_IDLE:-1}
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT_MS:-3000}
  SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-48}
  SERVER_TOMCAT_ACCEPT_COUNT: ${SERVER_TOMCAT_ACCEPT_COUNT:-64}

x-app-defaults: &app-defaults
  restart: unless-stopped
  stop_grace_period: 40s
  mem_limit: 512m
  cpus: 0.75
  pids_limit: 256
  networks: [devcircle]
  security_opt: [no-new-privileges:true]
  logging: *json-logging

services:
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    mem_limit: 2048m
    cpus: 1.5
    pids_limit: 512
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_USER:-devcircle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-connections=120", "--innodb-buffer-pool-size=768M"]
    volumes:
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [devcircle]
    logging: *json-logging

  redis:
    image: redis:8.2.3-alpine
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$$REDIS_PASSWORD' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 15
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [devcircle]
    logging: *json-logging

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.25
    pids_limit: 512
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks: [devcircle]
    logging: *json-logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    restart: unless-stopped
    mem_limit: 2048m
    cpus: 1.5
    pids_limit: 512
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
    networks: [devcircle]
    logging: *json-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks: [devcircle]
    logging: *json-logging

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./deploy/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/prometheus/slo.yml:/etc/prometheus/slo.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    networks: [devcircle]
    security_opt: [no-new-privileges:true]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"], interval: 15s, timeout: 5s, retries: 12 }
    logging: *json-logging

  alertmanager:
    image: prom/alertmanager:v0.29.0
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.15
    pids_limit: 128
    volumes:
      - ${ALERTMANAGER_CONFIG_PATH:?ALERTMANAGER_CONFIG_PATH is required}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [devcircle]
    security_opt: [no-new-privileges:true]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"], interval: 15s, timeout: 5s, retries: 12 }
    logging: *json-logging

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    restart: unless-stopped
    user: "0:0"
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger-data:/badger
    networks: [devcircle]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:14269/"], interval: 15s, timeout: 5s, retries: 12 }
    logging: *json-logging

  minio-maintenance:
    image: alpine:3.22.2
    profiles: ["ops"]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    command: ["true"]
    volumes: [minio-data:/minio-data]
    networks: [devcircle]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    logging: *json-logging

  dc-comment:
    <<: *app-defaults
    image: ghcr.io/wangyufanshuai/devcircle/dc-comment:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    environment: *app-env
    expose: ["8104"]
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8104/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 12 }

  dc-recommend:
    <<: *app-defaults
    image: ghcr.io/wangyufanshuai/devcircle/dc-recommend:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    environment: *app-env
    expose: ["8107"]
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      dc-content-aggregate: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8107/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 12 }

  dc-notification:
    <<: *app-defaults
    image: ghcr.io/wangyufanshuai/devcircle/dc-notification:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    environment: *app-env
    expose: ["8108"]
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8108/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 12 }

  dc-admin:
    <<: *app-defaults
    image: ghcr.io/wangyufanshuai/devcircle/dc-admin:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    environment:
      <<: *app-env
      DC_AUTH_URI: http://dc-identity:8201
      DC_USER_URI: http://dc-identity:8201
      DC_AUTH_OUTBOX_PATH: /internal/ops/identity/outbox/auth/status
      DC_USER_OUTBOX_PATH: /internal/ops/identity/outbox/user/status
      DC_INTERACTION_URI: http://dc-identity:8201
      DC_INTERACTION_OUTBOX_PATH: /internal/ops/identity/outbox/interaction/status
      DC_CONTENT_URI: http://dc-content-aggregate:8202
      DC_COMMENT_URI: http://dc-comment:8104
    expose: ["8110"]
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      dc-identity: { condition: service_healthy }
      dc-content-aggregate: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8110/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 12 }

  dc-identity:
    <<: *app-defaults
    image: ghcr.io/wangyufanshuai/devcircle/dc-identity:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    environment:
      <<: *app-env
      # Four logical schemas share the existing 16-connection per-replica ceiling.
      # Notification remains read-only here until its explicit production cutover.
      IDENTITY_AUTH_DB_POOL_MAX_SIZE: ${IDENTITY_AUTH_DB_POOL_MAX_SIZE:-6}
      IDENTITY_AUTH_DB_POOL_MIN_IDLE: ${IDENTITY_AUTH_DB_POOL_MIN_IDLE:-1}
      IDENTITY_AUTH_DB_POOL_CONNECTION_TIMEOUT_MS: ${IDENTITY_AUTH_DB_POOL_CONNECTION_TIMEOUT_MS:-3000}
      IDENTITY_USER_DB_POOL_MAX_SIZE: ${IDENTITY_USER_DB_POOL_MAX_SIZE:-4}
      IDENTITY_USER_DB_POOL_MIN_IDLE: ${IDENTITY_USER_DB_POOL_MIN_IDLE:-1}
      IDENTITY_USER_DB_POOL_CONNECTION_TIMEOUT_MS: ${IDENTITY_USER_DB_POOL_CONNECTION_TIMEOUT_MS:-3000}
      IDENTITY_INTERACTION_DB_POOL_MAX_SIZE: ${IDENTITY_INTERACTION_DB_POOL_MAX_SIZE:-3}
      IDENTITY_INTERACTION_DB_POOL_MIN_IDLE: ${IDENTITY_INTERACTION_DB_POOL_MIN_IDLE:-1}
      IDENTITY_INTERACTION_DB_POOL_CONNECTION_TIMEOUT_MS: ${IDENTITY_INTERACTION_DB_POOL_CONNECTION_TIMEOUT_MS:-3000}
      IDENTITY_NOTIFICATION_DB_POOL_MAX_SIZE: ${IDENTITY_NOTIFICATION_DB_POOL_MAX_SIZE:-3}
      IDENTITY_NOTIFICATION_DB_POOL_MIN_IDLE: ${IDENTITY_NOTIFICATION_DB_POOL_MIN_IDLE:-1}
      IDENTITY_NOTIFICATION_DB_POOL_CONNECTION_TIMEOUT_MS: ${IDENTITY_NOTIFICATION_DB_POOL_CONNECTION_TIMEOUT_MS:-3000}
      # Identity is the sole Interaction owner in the default production topology.
      INTERACTION_FLYWAY_ENABLED: "true"
      INTERACTION_RUNTIME_OUTBOX_ENABLED: "true"
      # Standalone dc-notification is the only API/migration/consumer/topic/WebSocket owner.
      NOTIFICATION_RUNTIME_API_ENABLED: "false"
      NOTIFICATION_FLYWAY_ENABLED: "false"
      NOTIFICATION_RUNTIME_CONSUMER_ENABLED: "false"
      NOTIFICATION_RUNTIME_TOPIC_ADMIN_ENABLED: "false"
      NOTIFICATION_RUNTIME_WEBSOCKET_ENABLED: "false"
      DC_CONTENT_URI: http://dc-content-aggregate:8202
      # One-version compatibility for rollback to the previous Dashboard implementation.
      DC_NOTIFICATION_URI: http://dc-notification:8108
    expose: ["8201"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8201/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 12 }

  dc-content-aggregate:
    <<: *app-defaults
    image: ghcr.io/wangyufanshuai/devcircle/dc-content-aggregate:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    environment:
      <<: *app-env
      DC_USER_URI: http://dc-identity:8201
      DC_INTERACTION_URI: http://dc-identity:8201
    expose: ["8202"]
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      dc-identity: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8202/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 12 }

  dc-discovery:
    <<: *app-defaults
    image: ghcr.io/wangyufanshuai/devcircle/dc-discovery:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    environment: *app-env
    expose: ["8203"]
    depends_on:
      mysql: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      kafka: { condition: service_healthy }
      dc-content-aggregate: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8203/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 12 }

  dc-gateway:
    <<: *app-defaults
    image: ghcr.io/wangyufanshuai/devcircle/dc-gateway:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: aggregate
      DC_AUTH_URI: http://dc-identity:8201
      DC_IDENTITY_URI: http://dc-identity:8201
      DC_CONTENT_AGGREGATE_URI: http://dc-content-aggregate:8202
      DC_DISCOVERY_URI: http://dc-discovery:8203
      DC_SEARCH_URI: http://dc-discovery:8203
      DC_RECOMMEND_URI: http://dc-recommend:8107
      DC_USER_URI: http://dc-identity:8201
      DC_INTERACTION_URI: http://dc-identity:8201
      DC_NOTIFICATION_URI: http://dc-notification:8108
      DC_COMMENT_URI: http://dc-comment:8104
      DC_ADMIN_URI: http://dc-admin:8110
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      dc-identity: { condition: service_healthy }
      dc-content-aggregate: { condition: service_healthy }
      dc-discovery: { condition: service_healthy }
      dc-recommend: { condition: service_healthy }
      dc-notification: { condition: service_healthy }
      dc-comment: { condition: service_healthy }
      dc-admin: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 12 }

  web-static:
    image: ghcr.io/wangyufanshuai/devcircle/web:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    expose: ["80"]
    depends_on:
      dc-gateway: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [devcircle]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost/"], interval: 15s, timeout: 5s, retries: 12 }
    logging: *json-logging

  web:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL is required}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web-static: { condition: service_healthy }
    networks: [devcircle]
    security_opt: [no-new-privileges:true]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"], interval: 15s, timeout: 5s, retries: 12 }
    logging: *json-logging

networks:
  devcircle:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  elasticsearch-data:
  minio-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
  jaeger-data:
