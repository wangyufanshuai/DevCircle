name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*"
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/devcircle -f deploy/helm/devcircle/values-dev.yaml
      - run: helm lint deploy/helm/devcircle -f deploy/helm/devcircle/values-prod.yaml
      - run: docker compose --profile infra config
      - run: docker compose --profile demo config

  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend, delivery]
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth, user, content, comment, interaction, search, recommend, notification, file, admin]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          push: true
          build-args: JAR_FILE=dc-${{ matrix.service }}/target/dc-${{ matrix.service }}-0.1.0-SNAPSHOT.jar
          tags: ghcr.io/wangyufanshuai/devcircle/dc-${{ matrix.service }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/wangyufanshuai/devcircle/dc-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  web-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [frontend, delivery]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ghcr.io/wangyufanshuai/devcircle/web:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/wangyufanshuai/devcircle/web:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
