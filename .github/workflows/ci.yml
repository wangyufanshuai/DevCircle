name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: python scripts/ops/assert_migration_versions.py
      - run: ./mvnw -B verify -Pcoverage
      - run: MIN_LINE_COVERAGE=75 MIN_BRANCH_COVERAGE=70 bash scripts/ops/assert-coverage.sh
      - run: python scripts/ops/assert-critical-state-coverage.py
      - run: bash scripts/ops/assert-no-skipped-tests.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*"
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/**"
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false

  real-auth-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: bash scripts/e2e/run-real-auth.sh
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: real-auth-e2e-artifacts
          path: web/test-results/**
          if-no-files-found: ignore

  real-content-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: bash scripts/e2e/run-real-content.sh
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: real-content-e2e-artifacts
          path: web/test-results/**
          if-no-files-found: ignore

  real-review-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: bash scripts/e2e/run-real-review.sh
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: real-review-e2e-artifacts
          path: web/test-results/**
          if-no-files-found: ignore

  real-community-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: bash scripts/e2e/run-real-community.sh
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: real-community-e2e-artifacts
          path: web/test-results/**
          if-no-files-found: ignore

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: bash scripts/e2e/test-docker-preflight.sh
      - run: bash scripts/ops/test-assert-coverage.sh
      - run: bash scripts/ops/test-validate-production-env.sh
      - run: bash scripts/ops/test-backup-restore.sh
      - run: bash scripts/ops/test-verify-image-identity.sh
      - run: helm lint deploy/helm/devcircle -f deploy/helm/devcircle/values-dev.yaml
      - run: helm lint deploy/helm/devcircle -f deploy/helm/devcircle/values-prod.yaml --set image.tag=0123456789abcdef0123456789abcdef01234567
      - run: docker compose --profile infra config
      - run: docker compose --profile demo config
      - run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
      - name: Validate Prometheus rules and configs
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.7.3 check rules /etc/prometheus/slo.yml /etc/prometheus/alerts.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.7.3 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.7.3 check config /etc/prometheus/prometheus.prod.yml
      - name: Validate Alertmanager routes and Grafana dashboard
        run: |
          docker run --rm -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" --entrypoint /bin/amtool prom/alertmanager:v0.29.0 check-config /etc/alertmanager/alertmanager.dev.yml
          docker run --rm -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" --entrypoint /bin/amtool prom/alertmanager:v0.29.0 check-config /etc/alertmanager/alertmanager.example.yml
          python -m json.tool deploy/grafana/dashboards/devcircle-overview.json > /dev/null
      - run: python -m unittest scripts/ops/test_assert_production_resource_budgets.py
      - run: python -m unittest scripts/ops/test_assert_critical_state_coverage.py
      - run: python -m unittest scripts/ops/test_assert_migration_versions.py
      - run: python -m unittest scripts/ops/test_k6_contract.py
      - run: python -m unittest scripts/ops/test_linux_acceptance_contract.py
      - run: python scripts/ops/assert-production-resource-budgets.py

  source-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate Java CycloneDX SBOM
        run: ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DskipTests -DoutputFormat=json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Generate web CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > bom.json
        working-directory: web
      - uses: actions/upload-artifact@v5
        with:
          name: source-sbom
          path: |
            target/bom.json
            web/bom.json
          if-no-files-found: error

  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - real-auth-e2e
      - real-content-e2e
      - real-review-e2e
      - real-community-e2e
      - delivery
      - source-sbom
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: dc-gateway, image: dc-gateway }
          - { module: dc-identity, image: dc-identity }
          - { module: dc-content-deployment, image: dc-content-aggregate }
          - { module: dc-discovery, image: dc-discovery }
          - { module: dc-auth, image: dc-auth }
          - { module: dc-user, image: dc-user }
          - { module: dc-content, image: dc-content }
          - { module: dc-comment, image: dc-comment }
          - { module: dc-interaction, image: dc-interaction }
          - { module: dc-search, image: dc-search }
          - { module: dc-recommend, image: dc-recommend }
          - { module: dc-notification, image: dc-notification }
          - { module: dc-file, image: dc-file }
          - { module: dc-admin, image: dc-admin }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - id: executable
        name: Resolve executable service artifact
        shell: bash
        run: |
          if [[ "${{ matrix.module }}" == "dc-auth" ]]; then
            path="dc-auth/target/dc-auth-0.1.0-SNAPSHOT-exec.jar"
          elif [[ "${{ matrix.module }}" == "dc-search" ]]; then
            # Search remains an executable rollback artifact; production embeds
            # its ordinary dependency artifact in dc-discovery.
            path="dc-search/target/dc-search-0.1.0-SNAPSHOT-exec.jar"
          else
            path="${{ matrix.module }}/target/${{ matrix.module }}-0.1.0-SNAPSHOT.jar"
          fi
          jar tf "${path}" | grep -q '^BOOT-INF/classes/'
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          push: true
          build-args: JAR_FILE=${{ steps.executable.outputs.path }}
          tags: ghcr.io/wangyufanshuai/devcircle/${{ matrix.image }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image with GitHub OIDC
        env:
          IMAGE_REF: ghcr.io/wangyufanshuai/devcircle/${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/wangyufanshuai/devcircle/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify signed image and provenance
        env:
          IMAGE_REF: ghcr.io/wangyufanshuai/devcircle/${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/ops/verify-image-identity.sh "${IMAGE_REF}@${IMAGE_DIGEST}"
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/wangyufanshuai/devcircle/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  web-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - frontend
      - real-auth-e2e
      - real-content-e2e
      - real-review-e2e
      - real-community-e2e
      - delivery
      - source-sbom
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ghcr.io/wangyufanshuai/devcircle/web:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image with GitHub OIDC
        env:
          IMAGE_REF: ghcr.io/wangyufanshuai/devcircle/web
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/wangyufanshuai/devcircle/web
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify signed image and provenance
        env:
          IMAGE_REF: ghcr.io/wangyufanshuai/devcircle/web
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/ops/verify-image-identity.sh "${IMAGE_REF}@${IMAGE_DIGEST}"
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/wangyufanshuai/devcircle/web:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
