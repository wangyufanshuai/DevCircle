name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify -Pcoverage
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*"
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/**"
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/devcircle -f deploy/helm/devcircle/values-dev.yaml
      - run: helm lint deploy/helm/devcircle -f deploy/helm/devcircle/values-prod.yaml --set image.tag=0123456789abcdef0123456789abcdef01234567
      - run: docker compose --profile infra config
      - run: docker compose --profile demo config
      - run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend, delivery]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: dc-gateway, image: dc-gateway }
          - { module: dc-identity, image: dc-identity }
          - { module: dc-content-deployment, image: dc-content-aggregate }
          - { module: dc-discovery, image: dc-discovery }
          - { module: dc-auth, image: dc-auth }
          - { module: dc-user, image: dc-user }
          - { module: dc-content, image: dc-content }
          - { module: dc-comment, image: dc-comment }
          - { module: dc-interaction, image: dc-interaction }
          - { module: dc-search, image: dc-search }
          - { module: dc-recommend, image: dc-recommend }
          - { module: dc-notification, image: dc-notification }
          - { module: dc-file, image: dc-file }
          - { module: dc-admin, image: dc-admin }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          push: true
          build-args: JAR_FILE=${{ matrix.module }}/target/${{ matrix.module }}-0.1.0-SNAPSHOT.jar
          tags: ghcr.io/wangyufanshuai/devcircle/${{ matrix.image }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/wangyufanshuai/devcircle/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  web-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [frontend, delivery]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ghcr.io/wangyufanshuai/devcircle/web:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/wangyufanshuai/devcircle/web:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
