version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "03:00", timezone: Asia/Shanghai }
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/web"
    schedule: { interval: weekly, day: monday, time: "03:15", timezone: Asia/Shanghai }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "03:30", timezone: Asia/Shanghai }
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "03:45", timezone: Asia/Shanghai }
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/web"
    schedule: { interval: weekly, day: monday, time: "04:00", timezone: Asia/Shanghai }
    open-pull-requests-limit: 3
