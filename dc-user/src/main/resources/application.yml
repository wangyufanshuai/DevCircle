server:
  port: 8102
spring:
  application:
    name: dc-user
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/dc_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:devcircle}
    password: ${MYSQL_PASSWORD:devcircle}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

