server:
  port: 8109
  shutdown: graceful
spring:
  application:
    name: dc-file
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:dc_file}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${MYSQL_USER:devcircle}
    password: ${MYSQL_PASSWORD:devcircle}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
devcircle:
  upload:
    max-bytes: ${UPLOAD_MAX_BYTES:10485760}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:devcircle}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/devcircle}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p traceId=%X{traceId:-} userId=%X{userId:-}"
