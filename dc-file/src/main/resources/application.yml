server:
  port: 8109
spring:
  application:
    name: dc-file
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
devcircle:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:devcircle}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/devcircle}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
