server:
  port: 8202
  shutdown: graceful
spring:
  application:
    name: dc-content-aggregate
  main:
    web-application-type: servlet
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${CONTENT_MYSQL_DATABASE:dc_content}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${MYSQL_USER:devcircle}
    password: ${MYSQL_PASSWORD:devcircle}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${CONTENT_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:8}}
      minimum-idle: ${CONTENT_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:1}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p traceId=%X{traceId:-} userId=%X{userId:-}"
devcircle:
  production: ${DEVCIRCLE_PRODUCTION_MODE:false}
  internal:
    user-uri: ${DC_USER_URI:http://localhost:8102}
    interaction-uri: ${DC_INTERACTION_URI:http://localhost:8105}
  outbox:
    # Keep the logical domain identity stable when the Content and File runtimes
    # share one JVM. Admin fleet health and recovery tooling key off this name.
    service-name: dc-content
  seed:
    theme-content:
      enabled: ${DEVCIRCLE_THEME_CONTENT_SEED_ENABLED:false}
  content:
    aggregate-db-pool-ceiling: ${CONTENT_AGGREGATE_DB_POOL_CEILING:8}
    read-fallback-enabled: ${DEVCIRCLE_READ_FALLBACK_ENABLED:false}
  comment-runtime:
    # Standalone dc-comment remains the sole production owner until cutover.
    enabled: ${COMMENT_RUNTIME_ENABLED:false}
    flyway-enabled: ${COMMENT_FLYWAY_ENABLED:true}
    outbox-enabled: ${COMMENT_OUTBOX_ENABLED:true}
    datasource:
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${COMMENT_MYSQL_DATABASE:dc_comment}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
      username: ${MYSQL_USER:devcircle}
      password: ${MYSQL_PASSWORD:devcircle}
      maximum-pool-size: ${COMMENT_DB_POOL_MAX_SIZE:3}
      minimum-idle: ${COMMENT_DB_POOL_MIN_IDLE:0}
      connection-timeout: ${COMMENT_DB_CONNECTION_TIMEOUT_MS:3000}
  upload:
    max-bytes: ${UPLOAD_MAX_BYTES:10485760}
    intent-ttl-minutes: ${UPLOAD_INTENT_TTL_MINUTES:15}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    presign-endpoint: ${S3_PRESIGN_ENDPOINT:${S3_ENDPOINT:http://localhost:9000}}
    bucket: ${S3_BUCKET:devcircle}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/devcircle}
