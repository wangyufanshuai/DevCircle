name: devcircle

x-service-env: &service-env
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: devcircle
  MYSQL_PASSWORD: devcircle
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ELASTICSEARCH_URIS: http://elasticsearch:9200
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_BASE_URL: http://localhost:29000/devcircle
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_SERVICE_NAME: devcircle
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
  GATEWAY_DEMO_TOKEN_ENABLED: "false"

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile.service

services:
  mysql:
    image: mysql:8.4
    profiles: ["infra", "demo"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: devcircle
    ports:
      - "23306:3306"
    volumes:
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2
    profiles: ["infra", "demo"]
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.1
    profiles: ["infra", "demo"]
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    profiles: ["infra", "demo"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "29200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["infra", "demo"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    profiles: ["infra", "demo"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["infra", "demo"]
    ports:
      - "19090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml

  grafana:
    image: grafana/grafana:12.3.0
    profiles: ["infra", "demo"]
    ports:
      - "13000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards

  dc-auth:
    profiles: ["app", "demo"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-auth/target/dc-auth-0.1.0-SNAPSHOT.jar }
    environment: *service-env
    ports: ["8101:8101"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  dc-user:
    profiles: ["app", "demo"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-user/target/dc-user-0.1.0-SNAPSHOT.jar }
    environment: *service-env
    ports: ["8102:8102"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  dc-content:
    profiles: ["app", "demo"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-content/target/dc-content-0.1.0-SNAPSHOT.jar }
    environment: *service-env
    ports: ["8103:8103"]
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }

  dc-comment:
    profiles: ["app", "demo"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-comment/target/dc-comment-0.1.0-SNAPSHOT.jar }
    environment: *service-env
    ports: ["8104:8104"]
    depends_on:
      mysql: { condition: service_healthy }

  dc-interaction:
    profiles: ["app", "demo"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-interaction/target/dc-interaction-0.1.0-SNAPSHOT.jar }
    environment: *service-env
    ports: ["8105:8105"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  dc-search:
    profiles: ["app", "demo"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-search/target/dc-search-0.1.0-SNAPSHOT.jar }
    environment: *service-env
    ports: ["8106:8106"]
    depends_on:
      elasticsearch: { condition: service_healthy }
      kafka: { condition: service_healthy }
      dc-content: { condition: service_started }

  dc-recommend:
    profiles: ["app", "demo"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-recommend/target/dc-recommend-0.1.0-SNAPSHOT.jar }
    environment: *service-env
    ports: ["8107:8107"]
    depends_on:
      redis: { condition: service_healthy }
      dc-content: { condition: service_started }

  dc-notification:
    profiles: ["app", "demo"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-notification/target/dc-notification-0.1.0-SNAPSHOT.jar }
    environment: *service-env
    ports: ["8108:8108"]
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }

  dc-file:
    profiles: ["app", "demo"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-file/target/dc-file-0.1.0-SNAPSHOT.jar }
    environment: *service-env
    ports: ["8109:8109"]
    depends_on:
      mysql: { condition: service_healthy }
      minio: { condition: service_healthy }

  dc-admin:
    profiles: ["app", "demo"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-admin/target/dc-admin-0.1.0-SNAPSHOT.jar }
    environment: *service-env
    ports: ["8110:8110"]
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }

  dc-gateway:
    profiles: ["app", "demo"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-gateway/target/dc-gateway-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *service-env
      DC_AUTH_URI: http://dc-auth:8101
      DC_USER_URI: http://dc-user:8102
      DC_CONTENT_URI: http://dc-content:8103
      DC_COMMENT_URI: http://dc-comment:8104
      DC_INTERACTION_URI: http://dc-interaction:8105
      DC_SEARCH_URI: http://dc-search:8106
      DC_RECOMMEND_URI: http://dc-recommend:8107
      DC_NOTIFICATION_URI: http://dc-notification:8108
      DC_FILE_URI: http://dc-file:8109
      DC_ADMIN_URI: http://dc-admin:8110
    ports: ["8080:8080"]
    depends_on:
      - dc-auth
      - dc-content
      - dc-search
      - dc-recommend

  web:
    profiles: ["app", "demo"]
    build:
      context: ./web
      dockerfile: Dockerfile
    ports: ["5501:80"]
    depends_on:
      dc-gateway: { condition: service_started }

volumes:
  mysql-data:
  minio-data:
