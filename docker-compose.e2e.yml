name: devcircle-real-auth-e2e

x-app-defaults: &app-defaults
  restart: "no"
  networks: [e2e]
  security_opt: [no-new-privileges:true]
  environment: &app-env
    DEVCIRCLE_PRODUCTION_MODE: "true"
    DEVCIRCLE_JWT_SECRET: Aa1!Bb2@Cc3#Dd4~Ee5%Ff6^Gg7&Hh8*Ii9(Jj0)Kk1_Ll2+Mm3-Nn4=Oo5?Pp6Qq7~
    DEVCIRCLE_INTERNAL_OPS_KEY: E2e-Internal-Ops-Key-2026-Only-For-Isolated-Compose
    REDIS_HOST: redis
    REDIS_PORT: 6379
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    DEVCIRCLE_OUTBOX_BATCH_SIZE: ${REAL_E2E_OUTBOX_BATCH_SIZE:-50}
    DEVCIRCLE_OUTBOX_MAX_ATTEMPTS: ${REAL_E2E_OUTBOX_MAX_ATTEMPTS:-8}
    DEVCIRCLE_OUTBOX_SEND_TIMEOUT_MS: ${REAL_E2E_OUTBOX_SEND_TIMEOUT_MS:-15000}
    # Keep the combined application pool ceiling below MySQL's 60-connection E2E cap.
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${REAL_E2E_DB_POOL_MAX_SIZE:-4}
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${REAL_E2E_DB_POOL_MIN_IDLE:-1}
    SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${REAL_E2E_DB_CONNECTION_TIMEOUT_MS:-3000}
    SPRINGDOC_API_DOCS_ENABLED: "false"
    SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    JAVA_TOOL_OPTIONS: -Xms32m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -XX:+UseSerialGC

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile.service

services:
  mysql:
    image: mysql:8.4.6
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root-password
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=64M"
      - "--performance-schema=OFF"
      - "--max-connections=60"
    volumes:
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
      - e2e-mysql:/var/lib/mysql
    networks: [e2e]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    image: redis:8.2.3-alpine
    restart: "no"
    networks: [e2e]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:4.1.1
    profiles: ["community", "performance", "search-recovery"]
    restart: "no"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms128m -Xmx192m
      KAFKA_LOG_CLEANER_ENABLE: "false"
    networks: [e2e]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    profiles: ["performance", "search-recovery"]
    restart: "no"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms384m -Xmx384m
    networks: [e2e]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36

  dc-auth:
    # Kept only for an explicit legacy-auth rollback/profile exercise.
    <<: *app-defaults
    profiles: ["legacy-auth"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-auth/target/dc-auth-0.1.0-SNAPSHOT-exec.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
      AUTH_COOKIE_SECURE: "false"
      AUTH_FRONTEND_CALLBACK_URI: http://127.0.0.1:5511/auth/callback
      DEVCIRCLE_OUTBOX_ENABLED: ${REAL_E2E_ENABLE_OUTBOX:-false}
    mem_limit: 256m
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8101/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-identity:
    <<: *app-defaults
    build:
      <<: *service-build
      args: { JAR_FILE: dc-identity/target/dc-identity-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
      AUTH_COOKIE_SECURE: "false"
      AUTH_FRONTEND_CALLBACK_URI: http://127.0.0.1:5511/auth/callback
      DEVCIRCLE_OUTBOX_ENABLED: ${REAL_E2E_ENABLE_OUTBOX:-false}
      DC_USER_URI: http://dc-user:8102
      DC_CONTENT_URI: http://dc-content:8103
      DC_INTERACTION_URI: http://dc-interaction:8105
      DC_NOTIFICATION_URI: http://dc-notification:8108
    mem_limit: 256m
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8201/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-content:
    <<: *app-defaults
    profiles: ["content", "review", "community", "performance", "search-recovery"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-content/target/dc-content-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
      DEVCIRCLE_READ_FALLBACK_ENABLED: "false"
      DEVCIRCLE_THEME_CONTENT_SEED_ENABLED: ${REAL_E2E_ENABLE_THEME_SEED:-false}
      DEVCIRCLE_KAFKA_TOPICS_ENABLED: "false"
      DEVCIRCLE_OUTBOX_ENABLED: ${REAL_E2E_ENABLE_OUTBOX:-false}
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    mem_limit: 256m
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8103/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-comment:
    <<: *app-defaults
    profiles: ["community"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-comment/target/dc-comment-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
      DEVCIRCLE_CONTENT_BASE_URL: http://dc-content:8103
      DEVCIRCLE_OUTBOX_ENABLED: ${REAL_E2E_ENABLE_OUTBOX:-false}
    mem_limit: 256m
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      dc-content: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8104/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-user:
    <<: *app-defaults
    profiles: ["community"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-user/target/dc-user-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
    mem_limit: 256m
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      dc-identity: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8102/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-notification:
    <<: *app-defaults
    profiles: ["community"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-notification/target/dc-notification-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
    mem_limit: 256m
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8108/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-recommend:
    <<: *app-defaults
    profiles: ["community", "performance"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-recommend/target/dc-recommend-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
      DEVCIRCLE_CONTENT_BASE_URL: http://dc-content:8103
      DEVCIRCLE_READ_FALLBACK_ENABLED: "false"
    mem_limit: 256m
    depends_on:
      dc-content: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8107/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-interaction:
    <<: *app-defaults
    profiles: ["community", "performance"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-interaction/target/dc-interaction-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
      DEVCIRCLE_CONTENT_BASE_URL: http://dc-content:8103
      DEVCIRCLE_OUTBOX_ENABLED: ${REAL_E2E_ENABLE_OUTBOX:-false}
    mem_limit: 256m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      dc-content: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8105/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-search:
    <<: *app-defaults
    profiles: ["performance", "search-recovery"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-search/target/dc-search-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      DEVCIRCLE_CONTENT_BASE_URL: http://dc-content:8103
      DEVCIRCLE_READ_FALLBACK_ENABLED: "false"
      DEVCIRCLE_KAFKA_RETRY_INITIAL_INTERVAL_MS: ${REAL_E2E_SEARCH_RETRY_INITIAL_INTERVAL_MS:-1000}
      DEVCIRCLE_KAFKA_RETRY_MULTIPLIER: ${REAL_E2E_SEARCH_RETRY_MULTIPLIER:-2.0}
      DEVCIRCLE_KAFKA_RETRY_MAX_INTERVAL_MS: ${REAL_E2E_SEARCH_RETRY_MAX_INTERVAL_MS:-10000}
      DEVCIRCLE_KAFKA_RETRY_MAX_ATTEMPTS: ${REAL_E2E_SEARCH_RETRY_MAX_ATTEMPTS:-4}
    mem_limit: 384m
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      dc-content: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8106/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 30

  dc-admin:
    <<: *app-defaults
    profiles: ["review", "community", "search-recovery"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-admin/target/dc-admin-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
      DEVCIRCLE_OUTBOX_ENABLED: ${REAL_E2E_ENABLE_OUTBOX:-false}
      DC_AUTH_URI: ${REAL_E2E_AUTH_URI:-http://dc-identity:8201}
      DC_USER_URI: http://dc-user:8102
      DC_CONTENT_URI: http://dc-content:8103
      DC_COMMENT_URI: http://dc-comment:8104
      DC_INTERACTION_URI: http://dc-interaction:8105
    mem_limit: 256m
    depends_on:
      dc-content: { condition: service_healthy }
      kafka: { condition: service_healthy, required: false }
      dc-identity: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8110/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-gateway:
    <<: *app-defaults
    build:
      <<: *service-build
      args: { JAR_FILE: dc-gateway/target/dc-gateway-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      DC_AUTH_URI: ${REAL_E2E_AUTH_URI:-http://dc-identity:8201}
      DC_IDENTITY_URI: http://dc-identity:8201
      DC_USER_URI: http://dc-user:8102
      DC_CONTENT_URI: http://dc-content:8103
      DC_INTERACTION_URI: http://dc-interaction:8105
      DC_SEARCH_URI: http://dc-search:8106
      DC_RECOMMEND_URI: http://dc-recommend:8107
      DC_NOTIFICATION_URI: http://dc-notification:8108
      DC_ADMIN_URI: http://dc-admin:8110
    ports: ["28080:8080"]
    mem_limit: 256m
    depends_on:
      dc-identity: { condition: service_healthy }
      dc-auth: { condition: service_healthy, required: false }
      dc-admin: { condition: service_healthy, required: false }
      dc-content: { condition: service_healthy, required: false }
      dc-user: { condition: service_healthy, required: false }
      dc-interaction: { condition: service_healthy, required: false }
      dc-search: { condition: service_healthy, required: false }
      dc-recommend: { condition: service_healthy, required: false }
      dc-notification: { condition: service_healthy, required: false }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

networks:
  e2e:
    driver: bridge

volumes:
  e2e-mysql:
