name: devcircle-real-auth-e2e

x-app-defaults: &app-defaults
  restart: "no"
  networks: [e2e]
  security_opt: [no-new-privileges:true]
  environment: &app-env
    DEVCIRCLE_PRODUCTION_MODE: "true"
    DEVCIRCLE_JWT_SECRET: Aa1!Bb2@Cc3#Dd4~Ee5%Ff6^Gg7&Hh8*Ii9(Jj0)Kk1_Ll2+Mm3-Nn4=Oo5?Pp6Qq7~
    REDIS_HOST: redis
    REDIS_PORT: 6379
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRINGDOC_API_DOCS_ENABLED: "false"
    SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    JAVA_TOOL_OPTIONS: -Xms32m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -XX:+UseSerialGC

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile.service

services:
  mysql:
    image: mysql:8.4.6
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root-password
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=64M"
      - "--performance-schema=OFF"
      - "--max-connections=60"
    volumes:
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
      - e2e-mysql:/var/lib/mysql
    networks: [e2e]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    image: redis:8.2.3-alpine
    restart: "no"
    networks: [e2e]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:4.1.1
    profiles: ["community"]
    restart: "no"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms128m -Xmx192m
      KAFKA_LOG_CLEANER_ENABLE: "false"
    networks: [e2e]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  dc-auth:
    <<: *app-defaults
    build:
      <<: *service-build
      args: { JAR_FILE: dc-auth/target/dc-auth-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
      AUTH_COOKIE_SECURE: "false"
      AUTH_FRONTEND_CALLBACK_URI: http://127.0.0.1:5511/auth/callback
    mem_limit: 256m
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8101/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-content:
    <<: *app-defaults
    profiles: ["content", "review", "community"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-content/target/dc-content-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
      DEVCIRCLE_READ_FALLBACK_ENABLED: "false"
      DEVCIRCLE_KAFKA_TOPICS_ENABLED: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    mem_limit: 256m
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8103/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-user:
    <<: *app-defaults
    profiles: ["community"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-user/target/dc-user-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
    mem_limit: 256m
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      dc-auth: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8102/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-notification:
    <<: *app-defaults
    profiles: ["community"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-notification/target/dc-notification-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
    mem_limit: 256m
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8108/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-recommend:
    <<: *app-defaults
    profiles: ["community"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-recommend/target/dc-recommend-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
      DEVCIRCLE_READ_FALLBACK_ENABLED: "false"
    mem_limit: 256m
    depends_on:
      dc-content: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8107/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-admin:
    <<: *app-defaults
    profiles: ["review"]
    build:
      <<: *service-build
      args: { JAR_FILE: dc-admin/target/dc-admin-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: devcircle
      MYSQL_PASSWORD: e2e-database-password
    mem_limit: 256m
    depends_on:
      dc-content: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8110/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

  dc-gateway:
    <<: *app-defaults
    build:
      <<: *service-build
      args: { JAR_FILE: dc-gateway/target/dc-gateway-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      DC_AUTH_URI: http://dc-auth:8101
      DC_USER_URI: http://dc-user:8102
      DC_CONTENT_URI: http://dc-content:8103
      DC_RECOMMEND_URI: http://dc-recommend:8107
      DC_NOTIFICATION_URI: http://dc-notification:8108
      DC_ADMIN_URI: http://dc-admin:8110
    ports: ["28080:8080"]
    mem_limit: 256m
    depends_on:
      dc-auth: { condition: service_healthy }
      dc-admin: { condition: service_healthy, required: false }
      dc-content: { condition: service_healthy, required: false }
      dc-user: { condition: service_healthy, required: false }
      dc-recommend: { condition: service_healthy, required: false }
      dc-notification: { condition: service_healthy, required: false }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24

networks:
  e2e:
    driver: bridge

volumes:
  e2e-mysql:
